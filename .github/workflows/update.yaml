name: Update Data
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v1
      - run: deno run -A main.ts
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Auto Updated Data
